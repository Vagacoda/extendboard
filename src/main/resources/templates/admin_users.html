<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>회원 관리</title></head>
<body>
<h1>관리자 전용 - 회원 관리 목록</h1>
<a href="/">게시판으로 돌아가기</a>
<hr>

<table border="1">
  <tr>
    <th>고유 ID</th>
    <th>아이디</th>
    <th>권한</th>
    <th>관리 기능</th>
  </tr>
  <tr th:each="user : ${users}">
    <td th:text="${user.id}">1</td>
    <td th:text="${user.loginId}">root</td>
    <td th:text="${user.role}">ADMIN</td>
    <td>
      <!-- 자기 자신 삭제 불가 제어 -->
      <span th:if="${user.id != loginUser.id}">
        <a th:href="@{/admin/user/delete/{id}(id=${user.id})}" onclick="return confirm('해당 유저를 강제 삭제하시겠습니까?');">회원 삭제</a>
      </span>
      <span th:if="${user.id == loginUser.id}">- (본인)</span>
    </td>
  </tr>
</table>
</body>
</html>
